openapi: 3.1.0
info:
  title: DeepSeek Monitor Self-Service API
  version: 2.0.0
  description: |
    Balance, usage, and SingaPay top-up endpoints for the client key paired with a separate
    DeepSeek Monitor integration API key. Create or rotate this credential from the internal dashboard.
    It is not the upstream DeepSeek API key, and it can access only the paired key's self-service data.
    The integration secret is shown once when issued; store it in the consuming server's secret manager.
    This credential requirement replaces the previous self-service authentication with a DeepSeek API key.
    Existing consumers must create an integration credential in the dashboard and update their server configuration.
    Token cache hit and cache miss values are details within input tokens;
    billable tokens are input plus output, so cache tokens are not added twice.
servers:
  - url: https://deepseek.nagatech.id
    description: Configured gateway host
  - url: http://127.0.0.1:3002
    description: Local backend
security:
  - IntegrationBearerAuth: []
  - IntegrationApiKeyHeader: []
tags:
  - name: Account
    description: Balance and usage information for the DeepSeek key paired with the integration credential
  - name: Top-ups
    description: Create, recover, and inspect QRIS or Virtual Account top-ups for the paired DeepSeek key
paths:
  /api/v1/me/balance:
    get:
      operationId: getMyBalance
      tags: [Account]
      summary: Get the authenticated key's prepaid balance
      responses:
        '200':
          description: Current balance and request eligibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/me/topups:
    get:
      operationId: listMyTopUps
      tags: [Top-ups]
      summary: List SingaPay top-ups for the paired DeepSeek key
      parameters:
        - name: limit
          in: query
          description: Maximum top-ups to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Top-ups, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createMyQrisTopUp
      tags: [Top-ups]
      summary: Create a QRIS payment for the paired DeepSeek key
      description: |
        The returned QRIS does not add funds immediately. The balance is credited
        only after a verified SingaPay callback confirms the exact IDR amount.
        Reuse the same Idempotency-Key after a network timeout; do not submit a
        fresh key until the earlier payment status has been checked.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A unique client-generated key for this payment attempt; 8 to 128 safe characters.
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountIdr:
                  type: integer
                  minimum: 1
                  maximum: 1000000000
                  description: Whole rupiah amount to add after the provider confirms payment
              required: [amountIdr]
            examples:
              qrisTopUp:
                summary: Create a QRIS top-up
                value:
                  amountIdr: 50000
      responses:
        '201':
          description: QRIS payment attempt created or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Idempotency-Key is already associated with a different amount or in-flight creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/topups/va:
    post:
      operationId: createMyVaTopUp
      tags: [Top-ups]
      summary: Create a temporary Virtual Account for the paired DeepSeek key
      description: |
        Creates a one-use, temporary VA with a fixed IDR amount. The returned
        number does not add funds immediately. The key balance is credited only
        after a verified SingaPay VA callback confirms the exact amount, bank,
        and VA number. Minimum amount is Rp10,000. Bank availability depends on
        the merchant account's SingaPay activation.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A unique client-generated key for this payment attempt; 8 to 128 safe characters.
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountIdr:
                  type: integer
                  minimum: 10000
                  maximum: 1000000000
                  description: Fixed whole-rupiah amount to credit after provider confirmation
                bankCode:
                  type: string
                  enum: [BCA, BNI, BRI, MANDIRI, PERMATA, MAYBANK, CIMB, BSI, MUAMALAT, BNC, OCBC, DANAMON]
                  description: Bank code enabled for the merchant's SingaPay account
              required: [amountIdr, bankCode]
            examples:
              vaTopUp:
                summary: Create a BCA Virtual Account top-up
                value:
                  amountIdr: 50000
                  bankCode: BCA
      responses:
        '201':
          description: Virtual Account payment attempt created or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Existing payment must be checked or the idempotency key conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/topups/active:
    get:
      operationId: getMyActiveTopUp
      tags: [Top-ups]
      summary: Get the latest top-up that needs attention
      description: Returns the most recent payment that still needs attention, including creating, pending, review-required, expired, or failed attempts.
      responses:
        '200':
          description: Current or recoverable top-up status and method-specific payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No unfinished or recoverable top-up exists for the paired DeepSeek key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/usage:
    get:
      operationId: listMyUsage
      tags: [Account]
      summary: List usage events for the paired DeepSeek key
      description: |
        Results are ordered newest first. Use nextCursor from the response as
        cursor on the next request, keeping the same from/to filters. The to
        timestamp is exclusive.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: limit
          in: query
          description: Maximum events to return in one page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page
          schema:
            type: string
            maxLength: 2048
      responses:
        '200':
          description: A page of usage events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/me/topups/{merchantRef}:
    get:
      operationId: getMyTopUp
      tags: [Top-ups]
      summary: Get the status of one top-up
      parameters:
        - name: merchantRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Top-up status and method-specific payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Top-up does not belong to the paired DeepSeek key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/topups/{merchantRef}/reconcile:
    post:
      operationId: reconcileMyTopUp
      tags: [Top-ups]
      summary: Refresh a top-up status from SingaPay
      description: |
        Checks the existing SingaPay transaction and updates this payment record.
        It never creates a replacement payment. A verified paid result credits the key
        balance once; ambiguous results remain marked for review.
      parameters:
        - name: merchantRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Reconciled top-up status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Top-up does not belong to the paired DeepSeek key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/topups/{merchantRef}/release:
    post:
      operationId: releaseMyStuckQrisTopUp
      tags: [Top-ups]
      summary: Release a failed QRIS request that never returned a QR code
      description: |
        Frees this key's local top-up lock so a new payment request can be made.
        This is available only for failed or review-required QRIS attempts without QR or VA data.
        It does not cancel a payment at SingaPay and does not delete the history record. A late,
        verified payment callback for the old attempt still credits the balance once.
      parameters:
        - name: merchantRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Request released or already released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Top-up does not belong to the paired DeepSeek key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: QRIS is active, has QR data, or cannot be safely released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/topups/{merchantRef}/retry:
    post:
      operationId: retryMyTopUp
      tags: [Top-ups]
      summary: Recover or replace a top-up
      description: |
        Checks SingaPay before creating anything. If the exact existing payment is found,
        its payment details or final status are returned. A replacement is created only after complete
        searches confirm the previous payment is absent or expired. Ambiguous or incomplete
        searches return a conflict and do not create another payment. A late verified callback
        for an earlier attempt can still credit the balance once. An optional request body can select
        the replacement method, amount, and VA bank; these values are used only after the previous
        payment has passed the safety checks.
      parameters:
        - name: merchantRef
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: A new unique key for this recovery attempt; 8 to 128 safe characters.
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum: [qris, va]
                  description: Payment method for a safe replacement; defaults to the previous method
                amountIdr:
                  type: integer
                  minimum: 1
                  maximum: 1000000000
                  description: Replacement amount in whole rupiah; VA requires at least Rp10,000
                bankCode:
                  type: string
                  enum: [BCA, BNI, BRI, MANDIRI, PERMATA, MAYBANK, CIMB, BSI, MUAMALAT, BNC, OCBC, DANAMON]
                  description: Required when replacing a QRIS with a Virtual Account
      responses:
        '201':
          description: Existing payment recovered or a replacement payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Top-up does not belong to the paired DeepSeek key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Payment lookup is ambiguous, incomplete, or changed concurrently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/usage/summary:
    get:
      operationId: getMyUsageSummary
      tags: [Account]
      summary: Get aggregate usage and daily totals
      description: |
        If from and to are omitted, the summary covers the last 30 days through
        the current time. If only one boundary is supplied, the other defaults
        to the current time or a 30-day interval. The maximum period is 366 days.
        Daily request totals include all events; token and cost totals include
        confirmed events. Daily buckets use Asia/Jakarta.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Usage totals for the paired DeepSeek key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    IntegrationBearerAuth:
      type: http
      scheme: bearer
      description: The separate integration API key issued by the internal dashboard for one DeepSeek key
    IntegrationApiKeyHeader:
      type: apiKey
      in: header
      name: X-Integration-Key
      description: The separate integration API key issued by the internal dashboard; do not use the DeepSeek upstream key
  parameters:
    From:
      name: from
      in: query
      description: Inclusive ISO 8601 timestamp
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Exclusive ISO 8601 timestamp
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: Invalid date range or usage cursor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, unregistered, revoked, or inactive API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: The monitoring database is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: The request could not be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
      required: [statusCode, message]
    TopUp:
      type: [object, 'null']
      properties:
        amountIdr:
          type: number
        createdAt:
          type: string
          format: date-time
      required: [amountIdr, createdAt]
    TopUpRecord:
      type: object
      properties:
        amountIdr:
          type: integer
        currency:
          type: string
          const: IDR
        method:
          type: string
          enum: [qris, va]
        source:
          type: string
          enum: [manual, singapay]
        status:
          type: string
          enum: [creating, pending, paid, expired, failed, needs_review]
        merchantRef:
          type: [string, 'null']
        providerReference:
          type: [string, 'null']
        qrData:
          type: [string, 'null']
          description: EMV QRIS payload; present while a generated QR is available
        vaNumber:
          type: [string, 'null']
          description: Virtual Account number; present while a generated VA is available
        bankCode:
          type: [string, 'null']
          enum: [BCA, BNI, BRI, MANDIRI, PERMATA, MAYBANK, CIMB, BSI, MUAMALAT, BNC, OCBC, DANAMON, null]
        bankName:
          type: [string, 'null']
          description: Human-readable bank name for the Virtual Account
        expiresAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: [string, 'null']
          format: date-time
        reviewReason:
          type: [string, 'null']
        releasedAt:
          type: [string, 'null']
          format: date-time
          description: Set when an eligible failed QRIS request was released from blocking new top-ups
        canRelease:
          type: boolean
          description: True only when this failed or review-required QRIS has no QR or VA data and can be released
      required: [amountIdr, currency, method, source, status, merchantRef, providerReference, qrData, vaNumber, bankCode, bankName, expiresAt, createdAt, paidAt, reviewReason, releasedAt, canRelease]
    TopUpPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopUpRecord'
        nextCursor:
          type: 'null'
          description: Pagination cursor is not currently used for this response.
      required: [items, nextCursor]
    BalanceResponse:
      type: object
      properties:
        account:
          type: object
          properties:
            clientId:
              type: string
            clientName:
              type: string
            keyId:
              type: string
            keyHint:
              type: string
          required: [clientId, clientName, keyId, keyHint]
        balanceIdr:
          type: number
          description: Current key balance; may be negative after a request is charged
        currency:
          type: string
          const: IDR
        minimumBalanceForRequestIdr:
          type: number
          const: 10
        canMakeRequest:
          type: boolean
          description: True when the balance is at least Rp10 and the key/client are active
        status:
          type: object
          properties:
            client:
              type: string
              enum: [active, paused]
            key:
              type: string
              enum: [active, revoked]
          required: [client, key]
        topUps:
          type: object
          properties:
            count:
              type: integer
            last:
              $ref: '#/components/schemas/TopUp'
          required: [count, last]
      required: [account, balanceIdr, currency, minimumBalanceForRequestIdr, canMakeRequest, status, topUps]
    UsageEvent:
      type: object
      properties:
        id:
          type: string
        requestId:
          type: string
        path:
          type: string
        method:
          type: string
        model:
          type: [string, 'null']
        statusCode:
          type: [integer, 'null']
        usageStatus:
          type: string
          enum: [pending, confirmed, unavailable, not_metered, insufficient_balance]
        inputTokens:
          type: [integer, 'null']
        cacheHitTokens:
          type: [integer, 'null']
          description: Breakdown within inputTokens; do not add again to billableTokens
        cacheMissTokens:
          type: [integer, 'null']
          description: Breakdown within inputTokens; do not add again to billableTokens
        outputTokens:
          type: [integer, 'null']
        totalTokens:
          type: [integer, 'null']
        billableTokens:
          type: [integer, 'null']
          description: Input tokens plus output tokens
        costIdr:
          type: [number, 'null']
        pricePerMillionIdr:
          type: [number, 'null']
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        latencyMs:
          type: [integer, 'null']
      required:
        - id
        - requestId
        - path
        - method
        - model
        - statusCode
        - usageStatus
        - inputTokens
        - cacheHitTokens
        - cacheMissTokens
        - outputTokens
        - totalTokens
        - billableTokens
        - costIdr
        - pricePerMillionIdr
        - startedAt
        - finishedAt
        - latencyMs
    UsagePage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UsageEvent'
        pagination:
          type: object
          properties:
            limit:
              type: integer
            nextCursor:
              type: [string, 'null']
          required: [limit, nextCursor]
      required: [data, pagination]
    UsageSummary:
      type: object
      properties:
        period:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            timeZone:
              type: string
              const: Asia/Jakarta
          required: [from, to, timeZone]
        totals:
          type: object
          properties:
            requests:
              type: integer
            errors:
              type: integer
            confirmedRequests:
              type: integer
            tokens:
              type: object
              properties:
                input:
                  type: integer
                cacheHit:
                  type: integer
                  description: Included within input; informational breakdown only
                cacheMiss:
                  type: integer
                  description: Included within input; informational breakdown only
                output:
                  type: integer
                billable:
                  type: integer
                  description: Input plus output; cache values are not added a second time
              required: [input, cacheHit, cacheMiss, output, billable]
            costIdr:
              type: number
          required: [requests, errors, confirmedRequests, tokens, costIdr]
        byStatus:
          type: object
          properties:
            pending:
              type: integer
            confirmed:
              type: integer
            unavailable:
              type: integer
            not_metered:
              type: integer
            insufficient_balance:
              type: integer
          required: [pending, confirmed, unavailable, not_metered, insufficient_balance]
        series:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              requests:
                type: integer
              tokens:
                type: integer
              costIdr:
                type: number
            required: [date, requests, tokens, costIdr]
      required: [period, totals, byStatus, series]
